<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پرو مجازی جواهر</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100dvw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #loading-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 50%, #0a0a0a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 24px;
  }

  .logo-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid transparent;
    background: linear-gradient(#0a0a0a, #0a0a0a) padding-box,
                linear-gradient(45deg, #d4af37, #f8e370, #d4af37) border-box;
    animation: spin 1.5s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    color: #d4af37;
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  #app {
    display: none;
    position: relative;
    width: 100dvw;
    height: 100dvh;
  }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror for selfie feel, remove if back cam */
  }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #three-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* HUD overlay */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .hud-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }

  .brand {
    color: #d4af37;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 20px;
    padding: 6px 12px;
    color: #d4af37;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d4af37;
    animation: blink 1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-dot.found {
    background: #4ade80;
    animation: none;
  }

  .hud-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 30px 20px 40px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .instruction {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.6;
    transition: opacity 0.5s;
  }

  .instruction span {
    color: #d4af37;
    font-weight: 600;
  }

  .jewel-name {
    color: #d4af37;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* finger guide overlay */
  .guide-ring {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid rgba(212,175,55,0.6);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: all 0.1s;
    box-shadow: 0 0 20px rgba(212,175,55,0.4), inset 0 0 20px rgba(212,175,55,0.1);
    display: none;
  }

  .controls {
    display: flex;
    gap: 12px;
    pointer-events: all;
  }

  .ctrl-btn {
    background: rgba(212,175,55,0.15);
    border: 1px solid rgba(212,175,55,0.4);
    color: #d4af37;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }

  .ctrl-btn:active {
    background: rgba(212,175,55,0.35);
    transform: scale(0.96);
  }

  .size-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .size-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(212,175,55,0.15);
    border: 1px solid rgba(212,175,55,0.4);
    color: #d4af37;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    pointer-events: all;
  }

  .size-btn:active {
    background: rgba(212,175,55,0.35);
    transform: scale(0.9);
  }

  .size-label {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    letter-spacing: 2px;
    min-width: 60px;
    text-align: center;
  }

  #error-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    color: #d4af37;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
    text-align: center;
    z-index: 200;
  }

  #error-screen h2 { font-size: 22px; letter-spacing: 2px; }
  #error-screen p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.8; }

  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
  }
  .corner.tl { top: 8px; left: 8px; border-top: 2px solid rgba(212,175,55,0.5); border-left: 2px solid rgba(212,175,55,0.5); }
  .corner.tr { top: 8px; right: 8px; border-top: 2px solid rgba(212,175,55,0.5); border-right: 2px solid rgba(212,175,55,0.5); }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid rgba(212,175,55,0.5); border-left: 2px solid rgba(212,175,55,0.5); }
  .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid rgba(212,175,55,0.5); border-right: 2px solid rgba(212,175,55,0.5); }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="logo-ring">💍</div>
  <div class="loading-text">در حال بارگذاری...</div>
</div>

<!-- Error -->
<div id="error-screen">
  <div style="font-size:48px">⚠️</div>
  <h2>خطا در دسترسی</h2>
  <p id="error-msg">لطفاً دسترسی دوربین را در مرورگر تأیید کنید و صفحه را رفرش کنید.</p>
</div>

<!-- Main App -->
<div id="app">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="three-canvas"></canvas>

  <div class="guide-ring" id="guide-ring"></div>

  <div class="hud">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="hud-top">
      <div class="brand">✦ JEWEL AR</div>
      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">جستجو...</span>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="jewel-name">انگشتر طلا با الماس</div>
      <div class="instruction" id="instruction">
        دست خود را جلوی دوربین بگیرید<br>
        <span>انگشت اشاره</span> را نشان دهید
      </div>
      <div class="size-control">
        <button class="size-btn" id="size-down">−</button>
        <div class="size-label" id="size-label">سایز: ۱۰۰٪</div>
        <button class="size-btn" id="size-up">+</button>
      </div>
    </div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- MediaPipe Tasks Vision -->
<script type="module">
// ─── GLB file path (same folder as this HTML on GitHub) ───
const MODEL_URL = './ring_gold_with_diamond.glb';

// ── MediaPipe ──
import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');  // debug (hidden)
const threeCanvas = document.getElementById('three-canvas');
const guideRing   = document.getElementById('guide-ring');
const statusDot   = document.getElementById('status-dot');
const statusText  = document.getElementById('status-text');
const instruction = document.getElementById('instruction');
const sizeLabel   = document.getElementById('size-label');

let handLandmarker = null;
let scene, camera, renderer, ringMesh;
let ringScale = 1.0;
let lastVideoTime = -1;
let handFound = false;

// ── size buttons ──
document.getElementById('size-up').addEventListener('click', () => {
  ringScale = Math.min(ringScale + 0.1, 2.0);
  updateSizeLabel();
});
document.getElementById('size-down').addEventListener('click', () => {
  ringScale = Math.max(ringScale - 0.1, 0.3);
  updateSizeLabel();
});
function updateSizeLabel() {
  sizeLabel.textContent = `سایز: ${Math.round(ringScale * 100)}٪`;
}

// ── Three.js setup ──
function initThree() {
  scene = new THREE.Scene();

  const w = window.innerWidth;
  const h = window.innerHeight;

  camera = new THREE.PerspectiveCamera(75, w / h, 0.001, 100);
  camera.position.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({
    canvas: threeCanvas,
    alpha: true,
    antialias: true,
    premultipliedAlpha: false
  });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambient);

  const dir1 = new THREE.DirectionalLight(0xfff8e7, 2.0);
  dir1.position.set(1, 2, 2);
  scene.add(dir1);

  const dir2 = new THREE.DirectionalLight(0xd4af37, 1.0);
  dir2.position.set(-1, -1, 1);
  scene.add(dir2);

  const point = new THREE.PointLight(0xffffff, 1.5, 5);
  point.position.set(0, 1, 1);
  scene.add(point);

  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
}

// ── Load GLB ──
async function loadRingModel() {
  return new Promise((resolve, reject) => {
    // dynamic import GLTFLoader from CDN
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    script.onload = () => {
      const loader = new THREE.GLTFLoader();
      loader.load(
        MODEL_URL,
        (gltf) => {
          const model = gltf.scene;

          // Auto-center and normalize size
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);

          // Normalize to ~0.04 world units (realistic ring size)
          const maxDim = Math.max(size.x, size.y, size.z);
          const targetSize = 0.04;
          model.scale.setScalar(targetSize / maxDim);

          // Enhance materials
          model.traverse(child => {
            if (child.isMesh && child.material) {
              const mat = child.material;
              if (mat.name && mat.name.toLowerCase().includes('gold')) {
                mat.metalness = 1.0;
                mat.roughness = 0.15;
                mat.color.setHex(0xD4AF37);
              }
              if (mat.name && mat.name.toLowerCase().includes('diamond')) {
                mat.metalness = 0.0;
                mat.roughness = 0.0;
                mat.transparent = true;
                mat.opacity = 0.9;
              }
              mat.needsUpdate = true;
            }
          });

          model.visible = false;
          scene.add(model);
          ringMesh = model;
          resolve();
        },
        undefined,
        reject
      );
    };
    document.head.appendChild(script);
  });
}

// ── MediaPipe ──
async function initHandLandmarker() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    numHands: 1,
    minHandDetectionConfidence: 0.6,
    minHandPresenceConfidence: 0.6,
    minTrackingConfidence: 0.5
  });
}

// ── Camera ──
async function startCamera() {
  const constraints = {
    video: {
      facingMode: { ideal: 'environment' }, // back camera
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  };
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    return new Promise(r => { video.onloadedmetadata = () => r(); });
  } catch(e) {
    // fallback to any camera
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    return new Promise(r => { video.onloadedmetadata = () => r(); });
  }
}

// ── Landmark indices ──
// Index finger: MCP=5, PIP=6, DIP=7, TIP=8
// Ring finger:  MCP=13, PIP=14, DIP=15, TIP=16
const RING_FINGER_MCP = 13;
const RING_FINGER_PIP = 14;

// Convert normalized landmark to screen coords
function lmToScreen(lm) {
  return {
    x: (1 - lm.x) * window.innerWidth,  // mirrored
    y: lm.y * window.innerHeight,
    z: lm.z
  };
}

// Convert screen coords to Three.js world coords (at z=0 plane)
function screenToWorld(sx, sy) {
  const ndc = new THREE.Vector3(
    (sx / window.innerWidth) * 2 - 1,
    -(sy / window.innerHeight) * 2 + 1,
    0.5
  );
  ndc.unproject(camera);
  const dir = ndc.sub(camera.position).normalize();
  const dist = -camera.position.z / dir.z;
  return camera.position.clone().add(dir.multiplyScalar(dist));
}

// ── Main loop ──
function detect() {
  if (!handLandmarker || video.readyState < 2) {
    requestAnimationFrame(detect);
    return;
  }

  const now = performance.now();
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;

    const results = handLandmarker.detectForVideo(video, now);

    if (results.landmarks && results.landmarks.length > 0) {
      const lms = results.landmarks[0];

      // Ring finger base (between MCP and PIP)
      const mcp = lms[RING_FINGER_MCP];
      const pip = lms[RING_FINGER_PIP];

      // Midpoint for ring placement
      const midX = (mcp.x + pip.x) / 2;
      const midY = (mcp.y + pip.y) / 2;

      const sx = (1 - midX) * window.innerWidth;
      const sy = midY * window.innerHeight;

      // World position
      const worldPos = screenToWorld(sx, sy);
      ringMesh.position.copy(worldPos);

      // Finger width → ring scale
      const mcpS = lmToScreen(mcp);
      const pipS = lmToScreen(pip);
      const fingerLen = Math.hypot(pipS.x - mcpS.x, pipS.y - mcpS.y);
      // A finger segment is roughly 1x ring diameter
      const autoScale = (fingerLen / window.innerWidth) * 2.5 * ringScale;
      ringMesh.scale.setScalar(autoScale);

      // Finger rotation (align ring to finger angle)
      const angle = Math.atan2(pipS.y - mcpS.y, pipS.x - mcpS.x);
      ringMesh.rotation.set(0, 0, angle + Math.PI / 2);

      // Tilt based on depth (lm.z is rough depth)
      const depthTilt = (mcp.z - pip.z) * 5;
      ringMesh.rotation.x = depthTilt;

      ringMesh.visible = true;

      // Guide ring
      guideRing.style.display = 'block';
      guideRing.style.left = sx + 'px';
      guideRing.style.top  = sy + 'px';
      guideRing.style.width  = (fingerLen * 1.2) + 'px';
      guideRing.style.height = (fingerLen * 1.2) + 'px';

      if (!handFound) {
        handFound = true;
        statusDot.classList.add('found');
        statusText.textContent = 'دست پیدا شد';
        instruction.innerHTML = `انگشتر روی <span>انگشت حلقه</span> شما قرار گرفت`;
      }
    } else {
      ringMesh.visible = false;
      guideRing.style.display = 'none';

      if (handFound) {
        handFound = false;
        statusDot.classList.remove('found');
        statusText.textContent = 'جستجو...';
        instruction.innerHTML = `دست خود را جلوی دوربین بگیرید<br><span>انگشت حلقه</span> را نشان دهید`;
      }
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(detect);
}

// ── Boot ──
async function boot() {
  try {
    initThree();
    await Promise.all([
      loadRingModel(),
      initHandLandmarker(),
      startCamera()
    ]);

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    detect();
  } catch(err) {
    console.error(err);
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('error-msg').textContent = err.message || 'خطا در راه‌اندازی. لطفاً رفرش کنید.';
  }
}

boot();
</script>
</body>
</html>
